
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docker_monitor
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - monitor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: docker_monitor
      FRONTEND_URL: http://localhost:3000
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - monitor-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only!
    restart: unless-stopped
    # Security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - monitor-network
    restart: unless-stopped
    # Poista read_only ja tmpfs - nginx tarvitsee kirjoitusoikeuksia
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

networks:
  monitor-network:
    driver: bridge

volumes:
  timescale-data:
